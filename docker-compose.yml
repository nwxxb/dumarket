services:
  db:
    image: postgres:14.20-alpine
    container_name: dumarket_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 300M
    shm_size: "128mb"

  redis:
    image: redis:7-alpine
    container_name: dumarket_redis
    deploy:
      resources:
        limits:
          memory: 64M

  web:
    build:
      context: .
      args:
        - RUBY_VERSION=${RUBY_VERSION}
        - NODE_VERSION=${NODE_VERSION}
        - YARN_VERSION=${YARN_VERSION}
    container_name: dumarket_web
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails s -p 3000 -b '0.0.0.0'"
    stdin_open: true
    tty: true
    volumes:
      - .:/rails
      - /rails/public/assets
    ports:
      - "3000:3000"
    environment:
      - RAILS_LOG_PATH=log/experiment_lograge_first.log
      - RAILS_ENV=${RAILS_ENV}
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      - db
      - redis
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  postgres_data:
